<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="theme-color" content="#FFFDFC">
<title>7 Years of Us</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#FFFDFC;
    --blush:#FCE6EE;
    --pink:#F3A9C4;
    --pink-deep:#E385AA;
    --silver:#D9DEE3;
    --silver-deep:#AEB6BD;
    --ink:#4A4048;
    --ink-soft:#8A7E85;
    color-scheme: light only;
  }
  html, body, *{
    forced-color-adjust: none;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{
    scroll-snap-type:y proximity;
    scroll-behavior:smooth;
    color-scheme: light only;
    background: #FFFDFC;
  }
  body{
    font-family:'Quicksand', sans-serif;
    font-weight:400;
    color:var(--ink);
    background:var(--white);
    overflow-x:hidden;
  }
  ::selection{background:var(--pink); color:#fff;}

  .page{
    min-height:100svh;
    scroll-snap-align:start;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:9vh 7vw;
    position:relative;
  }

  .script{
    font-family:'Parisienne', cursive;
    color:var(--pink-deep);
  }
  .display{
    font-family:'Playfair Display', serif;
  }

  .chapter-head{
    display:flex;
    align-items:baseline;
    gap:0.6rem;
    margin-bottom:1.2rem;
    opacity:0;
    position:relative;
    z-index:2;
  }
  .in-view .chapter-head{animation:fadeUp 0.9s ease forwards 0.1s;}
  .chapter-num{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:1.6rem;
    color:var(--pink-deep);
  }
  .chapter-label{
    letter-spacing:0.3em;
    text-transform:uppercase;
    font-size:0.68rem;
    color:var(--silver-deep);
  }

  /* giant faint numeral behind each chapter */
  .ghost-num{
    position:absolute;
    top:6%;
    left:50%;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:min(46vw, 260px);
    line-height:1;
    color:transparent;
    -webkit-text-stroke:1px rgba(227,133,170,0.18);
    z-index:0;
    pointer-events:none;
    user-select:none;
    opacity:0;
    transform:translate(-50%, 20px) scale(0.94);
  }
  .in-view .ghost-num{
    animation:ghostIn 1.4s ease forwards 0s;
  }
  @keyframes ghostIn{
    to{opacity:1; transform:translate(-50%, 0) scale(1);}
  }

  h1, h2{
    opacity:0;
    position:relative;
    z-index:2;
  }
  .in-view h1, .in-view h2{opacity:1;}
  /* word-by-word kinetic reveal, spans injected by JS */
  h1.chapter-title .word, .cover-title .word, h2.chapter-title .word{
    display:inline-block;
    opacity:0;
    transform:translateY(28px) rotate(2deg);
    filter:blur(3px);
  }
  .in-view h1.chapter-title .word, .in-view h2.chapter-title .word, .in-view .cover-title .word{
    animation:wordIn 0.7s cubic-bezier(.2,.8,.2,1) forwards;
  }
  @keyframes wordIn{
    to{opacity:1; transform:translateY(0) rotate(0); filter:blur(0);}
  }

  p.story-text{
    max-width:42ch;
    color:var(--ink-soft);
    font-size:1.05rem;
    line-height:1.7;
    margin-top:1.6rem;
    opacity:0;
    position:relative;
    z-index:2;
  }
  .in-view p.story-text{animation:fadeUp 1s ease forwards 0.55s;}

  @keyframes fadeUp{
    from{opacity:0; transform:translateY(22px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* alternate rhythm: icon settles below text on even chapters */
  .page.reverse .blob-stage{ order:2; margin-bottom:0; margin-top:1.8rem; }
  .page.reverse .chapter-head,
  .page.reverse h1,
  .page.reverse p.story-text{ order:1; }

  /* ---------- PAGE 1: COVER ---------- */
  #cover{
    position: relative;
    overflow: hidden;
    background: var(--white);
  }
  .cover-bg{
    position: absolute;
    inset: -6%;
    background-size: cover;
    background-position: center 30%;
    opacity: 0.9;
    transform: scale(1.08);
    transition: transform 0.2s ease-out;
    z-index: 0;
  }
  .cover-bg::after{
    content:"";
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(255,253,252,0.55) 0%, rgba(255,253,252,0.3) 35%, rgba(255,253,252,0.75) 75%, var(--white) 100%);
  }
  .petal-field{
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
  }
  .petal{
    position: absolute;
    top: -8%;
    font-size: 14px;
    color: var(--pink-deep);
    opacity: 0.75;
    animation: petalFall linear infinite;
  }
  @keyframes petalFall{
    0%{ transform: translate(0,0) rotate(0deg); opacity: 0; }
    8%{ opacity: 0.8; }
    92%{ opacity: 0.6; }
    100%{ transform: translate(var(--drift, 30px), 118vh) rotate(300deg); opacity: 0; }
  }
  .cover-caption{
    position: absolute;
    bottom: 8%;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    font-family: 'Parisienne', cursive;
    font-size: 1.1rem;
    color: var(--pink-deep);
    background: rgba(255,253,252,0.85);
    padding: 6px 18px;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.4s ease, transform 0.4s ease;
    z-index: 2;
    pointer-events: none;
    white-space: nowrap;
  }
  .cover-caption.show{
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .cover-number, .cover-title, .cover-sub, .gate, .scroll-cue{
    position: relative;
    z-index: 2;
  }
  .cover-number{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:clamp(5rem, 22vw, 11rem);
    line-height:0.85;
    color:var(--pink);
    -webkit-text-stroke:1.5px var(--pink-deep);
    opacity:0;
    animation:fadeUp 1.1s ease forwards 0.15s, numPulse 3.2s ease-in-out 1.3s infinite;
  }
  @keyframes numPulse{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.05);}
  }
  .cover-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(1.6rem, 5vw, 2.6rem);
    margin-top:0.6rem;
    text-shadow:0 0 24px rgba(255,255,255,0.9), 0 0 48px rgba(227,133,170,0.4);
    animation:titleGlow 3.4s ease-in-out infinite;
  }
  @keyframes titleGlow{
    0%,100%{ text-shadow:0 0 24px rgba(255,255,255,0.9), 0 0 48px rgba(227,133,170,0.35); }
    50%{ text-shadow:0 0 32px rgba(255,255,255,1), 0 0 64px rgba(227,133,170,0.6); }
  }
  .cover-sub{
    margin-top:1rem;
    color:var(--ink-soft);
    letter-spacing:0.08em;
    opacity:0;
    animation:fadeUp 1.1s ease forwards 0.9s;
  }
  .scroll-cue{
    position:absolute;
    bottom:6vh;
    font-size:0.68rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--silver-deep);
    opacity:0;
    animation:fadeUp 1s ease forwards 1.3s, bounceCue 1.8s ease-in-out 2.3s infinite;
  }
  @keyframes bounceCue{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(6px);}
  }

  /* ---------- CHAPTER BLOB ICON ---------- */
  .blob-stage{
    position:relative;
    width:min(58vw, 220px);
    aspect-ratio:1/1;
    margin-bottom:2rem;
  }
  .blob-bg{
    position:absolute;
    inset:0;
    border-radius:58% 42% 46% 54% / 50% 58% 42% 50%;
    background:linear-gradient(155deg, var(--blush), var(--silver) 130%);
    box-shadow:0 26px 50px -18px rgba(227,133,170,0.4);
    opacity:0;
    transform:scale(0.85);
    animation-fill-mode:forwards;
  }
  .in-view .blob-bg{
    animation:blobIn 0.9s cubic-bezier(.2,.9,.3,1.2) forwards, blobMorph 7s ease-in-out infinite 0.9s;
  }
  @keyframes blobIn{
    from{opacity:0; transform:scale(0.8);}
    to{opacity:1; transform:scale(1);}
  }
  @keyframes blobMorph{
    0%,100%{border-radius:58% 42% 46% 54% / 50% 58% 42% 50%;}
    50%{border-radius:44% 56% 58% 42% / 46% 42% 58% 54%;}
  }
  .chapter-icon{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    padding:22%;
  }
  .chapter-icon path, .chapter-icon circle, .chapter-icon polyline{
    fill:none;
    stroke:var(--pink-deep);
    stroke-width:2.2;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .chapter-icon .fill-soft{
    fill:var(--pink-deep);
    stroke:none;
    opacity:0.16;
  }
  .chapter-icon .draw{
    stroke-dasharray:220;
    stroke-dashoffset:220;
  }
  .in-view .chapter-icon .draw{
    animation:drawIcon 1.4s ease forwards 0.35s;
  }
  @keyframes drawIcon{ to{stroke-dashoffset:0;} }
  .chapter-icon .plane{
    offset-path:path("M18,78 Q50,20 84,24");
    offset-rotate:auto;
    opacity:0;
  }
  .in-view .chapter-icon .plane{
    animation:flyPlane 2.2s ease-in-out forwards 0.5s, planeFade 0.3s ease forwards 0.5s;
  }
  @keyframes flyPlane{
    from{offset-distance:0%;}
    to{offset-distance:100%;}
  }
  @keyframes planeFade{
    to{opacity:1;}
  }

  /* ---------- CHAPTER HEADINGS & SECTION TINTS ---------- */
  h1.chapter-title, h2.chapter-title{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:clamp(1.9rem, 5.5vw, 3rem);
    max-width:18ch;
    line-height:1.15;
  }
  h1.chapter-title em, h2.chapter-title em{
    font-family:'Parisienne', cursive;
    font-style:normal;
    font-weight:400;
    color:var(--pink-deep);
    font-size:1.15em;
  }
  #ch1{background:linear-gradient(180deg, var(--white), var(--blush));}
  #ch2{background:linear-gradient(180deg, var(--blush), var(--white));}
  #ch3{background:linear-gradient(180deg, var(--white), #F6F8F9);}
  #ch4{background:linear-gradient(180deg, #F6F8F9, var(--blush));}
  #ch5{background:linear-gradient(180deg, var(--blush), var(--white));}
  #ch6{background:linear-gradient(180deg, var(--white), #F6F8F9);}
  #ch7{background:linear-gradient(180deg, #F6F8F9, var(--blush));}
  #ch8{background:linear-gradient(180deg, var(--blush), var(--white));}
  #ch9{background:linear-gradient(180deg, var(--white), var(--silver) 160%);}
  #ch10{background:linear-gradient(180deg, var(--blush), var(--white));}
  #finale{
    background:
      radial-gradient(circle at 50% 20%, rgba(243,169,196,0.4), transparent 55%),
      radial-gradient(circle at 50% 90%, rgba(217,222,227,0.6), transparent 55%),
      var(--white);
  }
  .finale-mark{
    font-size:2rem;
    color:var(--pink-deep);
    margin-bottom:1.2rem;
    opacity:0;
    position:relative; z-index:2;
  }
  .in-view .finale-mark{animation:fadeUp 0.9s ease forwards 0s;}
  .finale-names{
    margin-top:2.2rem;
    letter-spacing:0.3em;
    text-transform:uppercase;
    font-size:0.78rem;
    color:var(--pink-deep);
    opacity:0;
    position:relative; z-index:2;
  }
  .in-view .finale-names{animation:fadeUp 1s ease forwards 0.8s;}
  .finale-date{
    margin-top:0.5rem;
    color:var(--silver-deep);
    font-size:0.78rem;
    opacity:0;
    position:relative; z-index:2;
  }
  .in-view .finale-date{animation:fadeUp 1s ease forwards 0.95s;}

  /* ---------- LIVE TIME-TOGETHER COUNTER ---------- */
  .live-counter{
    margin-top:2rem;
    padding:1.2rem 1.6rem;
    border-radius:18px;
    background:linear-gradient(160deg, rgba(255,255,255,0.7), rgba(243,169,196,0.18));
    border:1px solid rgba(227,133,170,0.25);
    box-shadow:0 18px 40px -20px rgba(74,64,72,0.25);
    opacity:0;
    position:relative; z-index:2;
    max-width:320px;
    margin-left:auto; margin-right:auto;
  }
  .in-view .live-counter{animation:fadeUp 1s ease forwards 1.1s;}
  .live-counter-label{
    font-size:0.62rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--pink-deep);
    margin-bottom:0.7rem;
  }
  .live-counter-grid{
    display:flex;
    justify-content:center;
    gap:0.7rem;
  }
  .live-counter-unit{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-width:44px;
  }
  .live-counter-num{
    font-family:'Playfair Display', serif;
    font-weight:600;
    font-size:1.5rem;
    font-variant-numeric:tabular-nums;
    color:var(--ink);
    transition:transform 0.15s ease;
  }
  .live-counter-num.tick{
    animation:tickPulse 0.4s ease;
  }
  @keyframes tickPulse{
    0%{transform:scale(1); color:var(--pink-deep);}
    40%{transform:scale(1.18); color:var(--pink-deep);}
    100%{transform:scale(1); color:var(--ink);}
  }
  .live-counter-unit-label{
    font-size:0.55rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--silver-deep);
    margin-top:0.15rem;
  }
  .live-counter-sub{
    margin-top:0.7rem;
    font-family:'Parisienne', cursive;
    font-size:0.95rem;
    color:var(--pink-deep);
  }
  .anniv-countdown{
    margin-top:0.6rem;
    font-size:0.68rem;
    letter-spacing:0.05em;
    color:var(--silver-deep);
  }

  /* ---------- ANNIVERSARY DAY CELEBRATION ---------- */
  .anniv-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(243,169,196,0.96), rgba(227,133,170,0.98));
    opacity:0;
    pointer-events:none;
    transition:opacity 0.6s ease;
  }
  .anniv-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .anniv-card{
    text-align:center;
    color:#fff;
    padding:2rem;
    transform:scale(0.85);
    opacity:0;
    transition:transform 0.6s cubic-bezier(.2,.9,.3,1.3), opacity 0.6s ease;
  }
  .anniv-overlay.show .anniv-card{
    transform:scale(1);
    opacity:1;
  }
  .anniv-card h2{
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:clamp(1.8rem, 7vw, 2.8rem);
    margin-bottom:0.8rem;
  }
  .anniv-card p{
    font-family:'Parisienne', cursive;
    font-size:1.2rem;
    margin-bottom:1.6rem;
  }
  .anniv-close{
    padding:10px 26px;
    border-radius:30px;
    border:1.5px solid #fff;
    background:transparent;
    color:#fff;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    cursor:pointer;
  }

  /* ---------- SECRET WORD EASTER EGG ---------- */
  .secret-overlay{
    position:fixed;
    inset:0;
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 40%, rgba(46,31,42,0.55), rgba(46,31,42,0.85));
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease;
  }
  .secret-overlay.show{
    opacity:1;
    pointer-events:auto;
  }
  .secret-card{
    position:relative;
    background:linear-gradient(165deg, #ffffff, var(--blush) 140%);
    border-radius:24px;
    padding:2.4rem 2rem 2.1rem;
    max-width:280px;
    text-align:center;
    transform:scale(0.8) rotate(-3deg);
    opacity:0;
    transition:transform 0.55s cubic-bezier(.2,.9,.3,1.4), opacity 0.5s ease;
    box-shadow:0 30px 60px -20px rgba(46,31,42,0.5), 0 0 0 1px rgba(227,133,170,0.25);
  }
  .secret-overlay.show .secret-card{
    transform:scale(1) rotate(0deg);
    opacity:1;
    animation:secretFloat 3.5s ease-in-out infinite 0.6s;
  }
  @keyframes secretFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-6px) rotate(0.6deg); }
  }
  .secret-card::before, .secret-card::after{
    content:"";
    position:absolute;
    width:14px; height:14px;
    border:1.5px solid var(--pink-deep);
    opacity:0.5;
  }
  .secret-card::before{
    top:10px; left:10px;
    border-right:none; border-bottom:none;
  }
  .secret-card::after{
    bottom:10px; right:10px;
    border-left:none; border-top:none;
  }
  .secret-card .mark{
    font-size:1.6rem;
    color:var(--pink-deep);
    margin-bottom:0.9rem;
    display:inline-block;
    animation:secretHeartbeat 1.6s ease-in-out infinite;
  }
  @keyframes secretHeartbeat{
    0%,100%{ transform:scale(1); }
    25%{ transform:scale(1.18); }
    40%{ transform:scale(0.95); }
  }
  .secret-card p{
    font-family:'Parisienne', cursive;
    font-size:1.5rem;
    color:var(--ink);
    line-height:1.5;
  }
  .secret-card .secret-sign{
    margin-top:1rem;
    font-size:0.65rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--pink-deep);
    opacity:0.75;
  }

  .secret-hint{
    position:fixed;
    bottom:18px;
    left:50%;
    transform:translateX(-50%);
    z-index:40;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px 8px 16px;
    border-radius:30px;
    background:rgba(255,253,252,0.85);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:0 10px 26px -12px rgba(74,64,72,0.3), 0 0 0 1px rgba(227,133,170,0.18);
  }
  .secret-hint-label{
    font-family:'Parisienne', cursive;
    font-size:0.95rem;
    color:var(--pink-deep);
    white-space:nowrap;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .secret-hint-label .beat{
    display:inline-block;
    animation:secretHeartbeat 1.6s ease-in-out infinite;
  }
  .secret-input{
    width:92px;
    padding:6px 12px;
    border-radius:16px;
    border:1px solid rgba(227,133,170,0.35);
    background:#fff;
    font-size:0.72rem;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    text-align:center;
    outline:none;
    transition:border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .secret-input::placeholder{ color:var(--silver-deep); }
  .secret-input:focus{
    border-color:var(--pink-deep);
    box-shadow:0 0 0 3px rgba(227,133,170,0.15);
  }
  .secret-go{
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:linear-gradient(135deg, var(--pink-deep), var(--pink));
    color:#fff;
    font-size:0.7rem;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    box-shadow:0 4px 10px -3px rgba(227,133,170,0.6);
  }

  /* ---------- SCRATCH TO REVEAL ---------- */
  .scratch-wrap{
    position:relative;
    width:min(84vw, 300px);
    height:150px;
    margin:2rem auto 0;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 44px -18px rgba(74,64,72,0.35), 0 0 0 1px rgba(227,133,170,0.2);
    opacity:0;
  }
  .in-view .scratch-wrap{ animation:fadeUp 1s ease forwards 1.3s; }
  .scratch-label{
    position:absolute;
    top:8px; left:0; right:0;
    text-align:center;
    font-size:0.6rem;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--silver-deep);
    z-index:0;
  }
  .scratch-message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.6rem 1.4rem;
    text-align:center;
    background:linear-gradient(160deg, #fff, var(--blush));
    font-family:'Parisienne', cursive;
    font-size:1.15rem;
    color:var(--ink);
    line-height:1.4;
  }
  .scratch-canvas{
    position:absolute;
    inset:0;
    z-index:2;
    cursor:grab;
    touch-action:pan-y;
    transition:opacity 0.6s ease;
  }
  .scratch-canvas.done{
    opacity:0;
    pointer-events:none;
  }

  /* ---------- INSTAGRAM TEASER ---------- */
  .insta-teaser{
    margin:2rem auto 0;
    max-width:280px;
    padding:1.3rem 1.5rem;
    border-radius:20px;
    background:linear-gradient(135deg, #fdf497 0%, #fd5949 30%, #d6249f 60%, #285AEB 100%);
    text-decoration:none;
    display:block;
    opacity:0;
    box-shadow:0 18px 40px -18px rgba(214,36,159,0.55);
    transition:transform 0.2s ease;
  }
  .in-view .insta-teaser{ animation:fadeUp 1s ease forwards 1.5s; }
  .insta-teaser:active{ transform:scale(0.97); }
  .insta-teaser-inner{
    background:var(--white);
    border-radius:14px;
    padding:1rem 1.1rem;
    display:flex;
    align-items:center;
    gap:0.7rem;
  }
  .insta-icon{
    width:34px; height:34px;
    border-radius:9px;
    background:linear-gradient(135deg, #fdf497 0%, #fd5949 40%, #d6249f 70%, #285AEB 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    color:#fff;
    font-size:1.1rem;
  }
  .insta-text{ text-align:left; }
  .insta-title{
    font-size:0.8rem;
    font-weight:600;
    color:var(--ink);
  }
  .insta-sub{
    font-size:0.65rem;
    color:var(--pink-deep);
    font-family:'Parisienne', cursive;
    font-size:0.85rem;
  }

  .chapter-icon .ripple{

    fill:none;
    stroke:var(--pink-deep);
    opacity:0;
    transform-origin:center;
  }
  .in-view .chapter-icon .ripple{
    animation:ripple 2s ease-out infinite;
  }
  .in-view .chapter-icon .ripple.r2{ animation-delay:0.6s; }
  .in-view .chapter-icon .ripple.r3{ animation-delay:1.2s; }
  @keyframes ripple{
    0%{opacity:0.6; transform:scale(0.6);}
    100%{opacity:0; transform:scale(1.4);}
  }

  /* ---------- TAP-TO-REVEAL MEMORY NOTES ---------- */
  .blob-stage{ cursor:pointer; }
  .tap-hint{
    font-size:0.62rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--silver-deep);
    margin-top:-0.6rem;
    margin-bottom:1.2rem;
    opacity:0;
    position:relative; z-index:2;
  }
  .in-view .tap-hint{ animation:fadeUp 1s ease forwards 1.1s; }
  .reveal-note{
    max-width:34ch;
    margin:0.4rem auto 0;
    padding:0;
    font-family:'Parisienne', cursive;
    font-size:1.15rem;
    color:var(--pink-deep);
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height 0.5s ease, opacity 0.4s ease, margin 0.5s ease;
    position:relative; z-index:2;
  }
  .revealed .reveal-note{
    max-height:120px;
    opacity:1;
    margin-top:1rem;
  }
  @keyframes bounceTap{
    0%,100%{transform:scale(1);}
    35%{transform:scale(0.92);}
    60%{transform:scale(1.05);}
  }
  .blob-stage.tapped .blob-bg{ animation:blobIn 0.9s cubic-bezier(.2,.9,.3,1.2) forwards, blobMorph 7s ease-in-out infinite 0.9s, bounceTap 0.5s ease; }

  /* ---------- INTERACTIVE CHAT SIM ---------- */
  .chat-stage{
    width:min(80vw, 300px);
    min-height:150px;
    margin:0 auto 1.6rem;
    display:flex;
    flex-direction:column;
    gap:8px;
    justify-content:flex-end;
  }
  .chat-bubble{
    max-width:75%;
    padding:9px 14px;
    border-radius:16px;
    font-size:0.82rem;
    line-height:1.4;
    opacity:0;
    transform:translateY(10px) scale(0.9);
  }
  .chat-bubble.left{
    align-self:flex-start;
    background:var(--silver);
    color:var(--ink);
    border-bottom-left-radius:4px;
  }
  .chat-bubble.right{
    align-self:flex-end;
    background:var(--pink-deep);
    color:#fff;
    border-bottom-right-radius:4px;
  }
  .in-view .chat-bubble{
    animation:bubbleIn 0.5s ease forwards;
  }
  @keyframes bubbleIn{
    to{opacity:1; transform:translateY(0) scale(1);}
  }
  .chat-tap-hint{
    font-size:0.65rem;
    letter-spacing:0.15em;
    text-transform:uppercase;
    color:var(--silver-deep);
    margin-top:0.4rem;
    opacity:0;
  }
  .in-view .chat-tap-hint{ animation:fadeUp 1s ease forwards 2.6s; }

  /* ---------- POLAROID PHOTO ---------- */
  .polaroid-stage{
    perspective:1200px;
    margin:0 auto 2rem;
  }
  .polaroid{
    position:relative;
    width:min(74vw, 300px);
    background:#fff;
    padding:14px 14px 46px;
    box-shadow:0 25px 50px -15px rgba(174,182,189,0.5), 0 8px 20px -8px rgba(227,133,170,0.35);
    border-radius:3px;
    opacity:0;
    transform:rotate(-6deg) translateY(30px) scale(0.9);
    transform-style:preserve-3d;
    transition:transform 0.25s ease-out;
  }
  .in-view .polaroid{
    animation:polaroidIn 1s cubic-bezier(.2,.9,.3,1.15) forwards 0.1s;
  }
  @keyframes polaroidIn{
    from{opacity:0; transform:rotate(-6deg) translateY(30px) scale(0.9);}
    to{opacity:1; transform:rotate(-3deg) translateY(0) scale(1);}
  }
  .polaroid-photo{
    position:relative;
    width:100%;
    aspect-ratio:4/5;
    overflow:hidden;
    background:#EDE3E7;
  }
  .polaroid-photo img{
    position:absolute;
    inset:0;
    width:100%; height:100%;
    object-fit:cover;
    object-position:center 22%;
    filter:saturate(0.15) brightness(1.3) contrast(0.9);
    transform:scale(1.18);
    animation:kenburns 14s ease-in-out infinite alternate, develop 2.6s ease forwards 0.4s;
  }
  @keyframes kenburns{
    0%{transform:scale(1.18) translate(0,0);}
    100%{transform:scale(1.3) translate(-2.5%, -1.5%);}
  }
  @keyframes develop{
    0%{filter:saturate(0.15) brightness(1.3) contrast(0.9);}
    100%{filter:saturate(0.95) brightness(1) contrast(1);}
  }
  .polaroid-photo::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(160deg, rgba(243,169,196,0.14), rgba(217,222,227,0.1) 60%);
    mix-blend-mode:soft-light;
    pointer-events:none;
  }
  .polaroid-photo{ cursor:pointer; }
  .like-pop{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.3);
    font-size:4rem;
    color:#fff;
    text-shadow:0 4px 18px rgba(0,0,0,0.25);
    opacity:0;
    pointer-events:none;
    z-index:5;
  }
  .like-pop.show{
    animation:likePop 0.9s cubic-bezier(.2,.8,.3,1.4) forwards;
  }
  @keyframes likePop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.3);}
    30%{opacity:1; transform:translate(-50%,-50%) scale(1.15);}
    45%{transform:translate(-50%,-50%) scale(0.95);}
    75%{opacity:1; transform:translate(-50%,-50%) scale(1);}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1.05);}
  }
  .like-counter{
    position:absolute;
    bottom:-30px;
    left:50%;
    transform:translateX(-50%);
    font-size:0.68rem;
    letter-spacing:0.08em;
    color:var(--pink-deep);
    opacity:0;
    white-space:nowrap;
    z-index:3;
  }
  .like-counter.show{ animation:fadeUp 0.5s ease forwards; }

  .ghost-num{ cursor:pointer; }
  .ghost-num.poke{ animation:ghostPoke 0.5s ease; }
  @keyframes ghostPoke{
    0%,100%{ transform:translate(-50%,0) scale(1); }
    40%{ transform:translate(-50%,0) scale(1.08) rotate(-2deg); }
    70%{ transform:translate(-50%,0) scale(0.98) rotate(1deg); }
  }
  .polaroid-caption{
    position:absolute;
    bottom:10px; left:0; right:0;
    text-align:center;
    font-family:'Parisienne', cursive;
    font-size:1.15rem;
    color:var(--ink);
  }
  .tape{
    position:absolute;
    width:56px; height:20px;
    background:rgba(217,222,227,0.55);
    box-shadow:0 2px 6px rgba(0,0,0,0.08);
    z-index:2;
  }
  .tape.tl{top:-10px; left:-14px; transform:rotate(-40deg);}
  .tape.tr{top:-10px; right:-14px; transform:rotate(40deg);}

  .drift{
    position:absolute;
    font-size:0.8rem;
    color:var(--pink-deep);
    opacity:0;
    pointer-events:none;
  }
  .in-view .drift{ animation:driftUp 4.5s ease-in infinite; }
  .drift.d1{left:6%; top:70%; animation-delay:0.4s !important;}
  .drift.d2{left:88%; top:60%; animation-delay:1.6s !important; color:var(--silver-deep);}
  .drift.d3{left:16%; top:20%; animation-delay:2.8s !important; color:var(--silver-deep);}
  .drift.d4{left:80%; top:15%; animation-delay:1s !important;}
  @keyframes driftUp{
    0%{opacity:0; transform:translateY(0) scale(0.7);}
    15%{opacity:0.85;}
    85%{opacity:0.6;}
    100%{opacity:0; transform:translateY(-90px) scale(1.05);}
  }
  /* ---------- TOP PROGRESS BAR ---------- */
  .top-progress{
    position:fixed;
    top:0; left:0; right:0;
    display:flex;
    gap:5px;
    padding:14px 5vw 0;
    z-index:60;
    pointer-events:none;
  }
  .top-progress .seg{
    flex:1;
    height:3px;
    border-radius:2px;
    background:rgba(174,182,189,0.35);
    overflow:hidden;
  }
  .top-progress .seg-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--pink), var(--pink-deep));
    transition:width 0.5s ease;
  }
  /* ---------- ENTRY GATE ---------- */
  html{ overflow-y: hidden; }
  html.unlocked{ overflow-y: auto; }
  body.pre-gate .top-progress,
  body.pre-gate .dot-nav,
  body.pre-gate .orb-field,
  body.pre-gate .progress-caption{
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
  }
  .gate{
    margin-top: 2.4rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    opacity: 0;
    animation: fadeUp 1s ease forwards 1.6s;
    background: rgba(255,253,252,0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 24px;
    padding: 1.6rem 1.4rem 1.4rem;
    box-shadow: 0 20px 46px -18px rgba(74,64,72,0.35);
  }
  .gate-question{
    font-family: 'Parisienne', cursive;
    font-size: 1.75rem;
    color: var(--pink-deep);
    margin-bottom: 1.2rem;
    text-shadow: none;
  }
  .gate-btns{
    position: relative;
    width: min(80vw, 320px);
    height: 90px;
  }
  .gate-yes, .gate-no{
    padding: 12px 28px;
    border-radius: 30px;
    border: none;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    position: absolute;
    top: 0;
  }
  .gate-yes{
    left: calc(50% - 90px);
    background: linear-gradient(135deg, var(--pink-deep), var(--pink));
    color: #fff;
    box-shadow: 0 10px 24px -8px rgba(227,133,170,0.6);
    z-index: 2;
    transition: transform 0.25s ease;
  }
  .gate-yes:hover{ transform: scale(1.06); }
  .gate-no{
    left: calc(50% + 10px);
    background: var(--silver);
    color: var(--ink);
    transition: left 0.25s ease, top 0.25s ease;
    z-index: 1;
  }
  .gate-hint{
    margin-top: 0.8rem;
    font-size: 0.7rem;
    color: var(--silver-deep);
    letter-spacing: 0.08em;
    opacity: 0;
    height: 1em;
    transition: opacity 0.3s ease;
  }
  .gate-hint.show{ opacity: 1; }
  .gate.done{
    animation: gateAway 0.6s ease forwards;
  }
  @keyframes gateAway{
    to{ opacity: 0; transform: translateY(-14px) scale(0.92); height: 0; margin: 0; }
  }

  /* ---------- PASSCODE SCREEN ---------- */
  #pwGate{
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background:
      radial-gradient(circle at 30% 20%, rgba(243,169,196,0.45), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(217,222,227,0.65), transparent 50%),
      var(--white);
    clip-path: circle(150% at 50% 50%);
    transition: clip-path 1.1s cubic-bezier(.7,0,.15,1);
  }
  #pwGate.unlocked{
    clip-path: circle(0% at var(--iris-x, 50%) var(--iris-y, 50%));
    pointer-events: none;
  }
  #pwGate.gone{ visibility: hidden; }
  .pw-petal-field{
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .pw-card-stage{
  }
  .pw-card{
    position: relative;
    z-index: 1;
    background: rgba(255,253,252,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 26px;
    padding: 2.4rem 1.8rem 2.1rem;
    max-width: 320px;
    width: 84vw;
    text-align: center;
    box-shadow: 0 30px 60px -20px rgba(74,64,72,0.35), 0 0 0 1px rgba(227,133,170,0.2);
    opacity: 0;
    transform: scale(0.9) translateY(10px);
    animation: pwCardIn 0.9s cubic-bezier(.2,.9,.3,1.3) forwards 0.2s;
    transition: transform 0.15s ease-out;
  }
  @keyframes pwCardIn{
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .pw-lock{
    width: 68px;
    height: 68px;
    margin: 0 auto 1.1rem;
    position: relative;
  }
  .pw-lock svg{ width:100%; height:100%; overflow:visible; }
  .pw-lock .lock-heart{
    fill: none;
    stroke: var(--pink-deep);
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .pw-lock .lock-shackle{
    fill: none;
    stroke: var(--silver-deep);
    stroke-width: 3.2;
    stroke-linecap: round;
    transform-origin: 50% 62%;
    transition: transform 0.6s cubic-bezier(.3,1.4,.4,1);
  }
  .pw-lock .lock-body{
    fill: var(--blush);
    stroke: var(--pink-deep);
    stroke-width: 2;
  }
  .pw-lock .lock-hole{
    fill: var(--pink-deep);
  }
  #pwGate.opening .lock-shackle{
    transform: translateY(-6px) rotate(-35deg);
  }
  #pwGate.opening .pw-lock{
    animation: lockPop 0.5s ease;
  }
  @keyframes lockPop{
    0%{ transform: scale(1); }
    40%{ transform: scale(1.18); }
    100%{ transform: scale(1); }
  }

  .pw-title{
    font-family: 'Playfair Display', serif;
    font-weight: 600;
    font-size: clamp(1.3rem, 5vw, 1.7rem);
    color: var(--ink);
    margin-bottom: 0.4rem;
  }
  .pw-sub{
    font-family: 'Parisienne', cursive;
    font-size: 1.15rem;
    color: var(--pink-deep);
    margin-bottom: 1.8rem;
  }
  .pw-form{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
  }
  .pw-input-wrap{
    position: relative;
    width: 100%;
  }
  #pwInput{
    width: 100%;
    padding: 12px 44px 12px 18px;
    border-radius: 30px;
    border: 1.5px solid rgba(227,133,170,0.35);
    background: #fff;
    font-family: 'Quicksand', sans-serif;
    font-size: 0.95rem;
    color: var(--ink);
    text-align: center;
    outline: none;
    letter-spacing: 0.06em;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  #pwInput::placeholder{ color: var(--silver-deep); letter-spacing: normal; }
  #pwInput:focus{
    border-color: var(--pink-deep);
    box-shadow: 0 0 0 4px rgba(227,133,170,0.15);
  }
  #pwInput.shake{
    animation: pwShake 0.4s ease;
    border-color: #d9534f;
  }
  #pwToggle{
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--silver-deep);
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  @keyframes pwShake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-8px); }
    75%{ transform: translateX(8px); }
  }
  #pwSubmit{
    padding: 11px 34px;
    border-radius: 30px;
    border: none;
    background: linear-gradient(135deg, var(--pink-deep), var(--pink));
    color: #fff;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    box-shadow: 0 10px 24px -8px rgba(227,133,170,0.6);
    transition: transform 0.2s ease;
  }
  #pwSubmit:active{ transform: scale(0.96); }
  .pw-error{
    font-size: 0.72rem;
    color: #d9534f;
    height: 1em;
    opacity: 0;
  }
  .pw-error.show{ opacity: 1; }
  .pw-hint{
    margin-top: 1.2rem;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--silver-deep);
    opacity: 0.75;
  }

  #pwGate{
    background-size: 160% 160%;
    animation: coverDrift 10s ease-in-out infinite alternate;
  }

  /* orbiting sparkles around the lock */
  .pw-orbit{
    position: absolute;
    inset: 0;
    animation: pwOrbitSpin 9s linear infinite;
  }
  .pw-orbit span{
    position: absolute;
    font-size: 0.7rem;
    color: var(--pink-deep);
  }
  .pw-orbit span:nth-child(1){ top: -6px; left: 50%; transform: translateX(-50%); }
  .pw-orbit span:nth-child(2){ top: 50%; right: -8px; transform: translateY(-50%); color: var(--silver-deep); font-size: 0.55rem; }
  .pw-orbit span:nth-child(3){ bottom: -6px; left: 50%; transform: translateX(-50%); font-size: 0.6rem; }
  .pw-orbit span:nth-child(4){ top: 50%; left: -8px; transform: translateY(-50%); color: var(--silver-deep); font-size: 0.5rem; }
  @keyframes pwOrbitSpin{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(360deg); }
  }
  .pw-orbit span{ animation: pwOrbitCounter 9s linear infinite; }
  @keyframes pwOrbitCounter{
    from{ transform: rotate(0deg); }
    to{ transform: rotate(-360deg); }
  }

  /* tiny blurred glimpse of the real photo, peeking through the keyhole */
  .pw-peek{
    position: absolute;
    left: 50%; top: 57%;
    width: 9px; height: 15px;
    transform: translate(-50%, -50%);
    border-radius: 2px 2px 5px 5px;
    overflow: hidden;
    z-index: 0;
    box-shadow: 0 0 4px 1px rgba(255,255,255,0.5);
  }
  .pw-peek img{
    position: absolute;
    width: 220%;
    height: 220%;
    left: -60%;
    top: -70%;
    object-fit: cover;
    filter: blur(1.5px) saturate(1.2) brightness(1.05);
    opacity: 0.9;
  }

  .dot-nav{
    position:fixed;
    right:2.2vw;
    top:50%;
    transform:translateY(-50%);
    display:flex;
    flex-direction:column;
    gap:14px;
    z-index:50;
  }
  .dot-nav button{
    width:9px; height:9px;
    border-radius:50%;
    border:1.5px solid var(--pink-deep);
    background:transparent;
    cursor:pointer;
    padding:0;
    transition:background 0.3s ease, transform 0.3s ease;
  }
  .dot-nav button.active{
    background:var(--pink-deep);
    transform:scale(1.3);
  }
  @media (max-width:640px){
    .dot-nav{right:3.5vw; gap:10px;}
    .dot-nav button{width:7px; height:7px;}
  }

  footer.credit{
    text-align:center;
    padding:2.2rem 1rem;
    font-size:0.72rem;
    color:var(--silver-deep);
    background:var(--white);
  }

  /* ---------- CONVERGING AVATARS ---------- */
  .orb-field{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:5;
    overflow:hidden;
  }
  .orb{
    position:absolute;
    top:50%;
    width:38px; height:38px;
    border-radius:50%;
    transform:translate(-50%,-50%);
    transition:left 0.35s cubic-bezier(.22,.61,.36,1), box-shadow 0.6s ease, opacity 0.4s ease;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:600;
    font-size:0.95rem;
    pointer-events:auto;
    cursor:pointer;
  }
  .orb-him{
    background:linear-gradient(160deg, #E7EAED, var(--silver-deep));
    color:#4A4048;
    box-shadow:0 8px 22px -6px rgba(174,182,189,0.7), 0 0 0 2px rgba(255,255,255,0.7) inset;
    animation:bobHim 4.2s ease-in-out infinite;
  }
  .orb-her{
    background:linear-gradient(160deg, #FBD4E4, var(--pink-deep));
    color:#fff;
    box-shadow:0 8px 22px -6px rgba(227,133,170,0.6), 0 0 0 2px rgba(255,255,255,0.7) inset;
    animation:bobHer 3.6s ease-in-out infinite;
  }
  @keyframes bobHim{
    0%,100%{transform:translate(-50%,-58%);}
    50%{transform:translate(-50%,-42%);}
  }
  @keyframes bobHer{
    0%,100%{transform:translate(-50%,-42%);}
    50%{transform:translate(-50%,-58%);}
  }
  .orb.merged{
    opacity:0;
  }
  .orb-merged-label{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.7);
    padding:9px 20px;
    border-radius:22px;
    background:linear-gradient(135deg, var(--pink-deep), var(--silver-deep));
    color:#fff;
    font-family:'Parisienne', cursive;
    font-size:1.05rem;
    box-shadow:0 0 40px 8px rgba(227,133,170,0.55);
    opacity:0;
    z-index:6;
    pointer-events:none;
    transition:opacity 0.5s ease, transform 0.5s cubic-bezier(.2,.9,.3,1.3);
  }
  .orb-merged-label.show{
    opacity:1;
    transform:translate(-50%,-50%) scale(1);
    animation:mergedPulse 2.4s ease-in-out infinite 0.5s;
  }
  @keyframes mergedPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1);}
    50%{transform:translate(-50%,-50%) scale(1.06);}
  }
  .orb-trail{
    position:absolute;
    top:50%;
    height:2px;
    background:repeating-linear-gradient(90deg, var(--silver-deep) 0 6px, transparent 6px 12px);
    opacity:0.4;
    transform:translateY(-50%);
    transition:left 0.35s ease, width 0.35s ease;
  }
  .orb-trail::after{
    content:"\\2764";
    position:absolute;
    left:calc(50% - 6px);
    top:50%;
    transform:translateY(-50%);
    font-size:9px;
    color:var(--pink-deep);
    opacity:0.7;
  }
  .progress-caption{
    position:fixed;
    top:calc(50% + 32px);
    left:50%;
    transform:translateX(-50%);
    font-size:0.62rem;
    letter-spacing:0.25em;
    text-transform:uppercase;
    color:var(--silver-deep);
    z-index:5;
    pointer-events:none;
    transition:opacity 0.4s ease;
  }
  @media (max-width:640px){
    .orb{width:28px; height:28px; font-size:0.72rem;}
    .progress-caption{display:none;}
  }
</style>
