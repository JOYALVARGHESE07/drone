<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra Premium Joyal Varghese Animation</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(#0a0a0a, #111);
      color: #fff;
      overflow-x: hidden;
    }

    h1 {
      text-align: center;
      font-size: 4em;
      margin-top: 50px;
      text-shadow: 0 0 20px #ff00ff, 0 0 30px #00ffff;
      animation: glow 2s infinite alternate;
    }

    @keyframes glow {
      0% { text-shadow: 0 0 10px #ff00ff, 0 0 20px #00ffff; }
      100% { text-shadow: 0 0 40px #ff00ff, 0 0 60px #00ffff; }
    }

    .wokwi-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 50px 0;
      animation: float 3s ease-in-out infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-20px); }
    }

    iframe {
      border: 5px solid #00ffff;
      border-radius: 20px;
      width: 90%;
      max-width: 800px;
      height: 600px;
      box-shadow: 0 0 50px #00ffff, 0 0 100px #ff00ff;
      transition: transform 0.3s;
    }

    iframe:hover {
      transform: scale(1.05) rotate(-1deg);
      box-shadow: 0 0 70px #ff00ff, 0 0 120px #00ffff;
    }

    /* Floating stars */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: -1;
      background: transparent;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <h1>Joyal Varghese Ultra Premium</h1>

  <div class="wokwi-container">
    <iframe src="https://wokwi.com/projects/460318666113414145" allowfullscreen></iframe>
  </div>

  <div class="stars" id="stars"></div>

  <script>
    // Generate stars
    const starsContainer = document.getElementById('stars');
    for (let i = 0; i < 100; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = Math.random() * 100 + 'vh';
      star.style.left = Math.random() * 100 + 'vw';
      star.style.width = 1 + Math.random() * 3 + 'px';
      star.style.height = star.style.width;
      star.style.animationDuration = 1 + Math.random() * 3 + 's';
      starsContainer.appendChild(star);
    }
  </script>
</body>
</html>
