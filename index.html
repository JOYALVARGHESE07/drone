<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra Premium Drone Animation</title>
<style>
  /* Reset and basic styles */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: radial-gradient(#000020, #000); overflow: hidden; font-family: 'Arial', sans-serif; }
  
  /* Starfield */
  .star { position: absolute; background: white; border-radius: 50%; }
  
  /* Premium name animation */
  .name {
    position: absolute;
    top: 20%;
    left: 50%;
    transform: translateX(-50%);
    font-size: 4rem;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 10px #ff0, 0 0 20px #ff0, 0 0 30px #f0f;
    animation: shimmer 3s infinite;
  }
  @keyframes shimmer {
    0%,100% { text-shadow: 0 0 10px #ff0, 0 0 20px #ff0, 0 0 30px #f0f; }
    50% { text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 60px #0ff; }
  }

  /* Drone styles */
  .drone {
    position: absolute;
    width: 50px;
    height: 20px;
    background: linear-gradient(90deg,#ff0,#f0f);
    border-radius: 10px;
    box-shadow: 0 0 20px #ff0, 0 0 40px #f0f;
    animation: fly 10s infinite;
  }

  @keyframes fly {
    0% { transform: translate3d(0,0,0) rotate(0deg); }
    25% { transform: translate3d(300px, 200px, 50px) rotate(10deg); }
    50% { transform: translate3d(600px, 100px, 0) rotate(-10deg); }
    75% { transform: translate3d(300px, 400px, 30px) rotate(5deg); }
    100% { transform: translate3d(0,0,0) rotate(0deg); }
  }

  /* Wokwi embed container */
  .wokwi-container {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 400px;
    height: 300px;
    border: 2px solid #fff;
    border-radius: 15px;
    overflow: hidden;
    box-shadow: 0 0 20px #0ff;
  }
</style>
</head>
<body>

<div class="name">Joyal Varghese</div>

<!-- Drone elements -->
<div class="drone" style="animation-delay:0s;"></div>
<div class="drone" style="animation-delay:2s;"></div>
<div class="drone" style="animation-delay:4s;"></div>

<!-- Starfield -->
<script>
  const stars = [];
  const numStars = 100;
  for(let i=0;i<numStars;i++){
    let star = document.createElement('div');
    star.classList.add('star');
    let size = Math.random()*3+1;
    star.style.width = size+'px';
    star.style.height = size+'px';
    star.style.top = Math.random()*window.innerHeight+'px';
    star.style.left = Math.random()*window.innerWidth+'px';
    star.style.opacity = Math.random();
    document.body.appendChild(star);
    stars.push(star);
  }

  function animateStars(){
    stars.forEach(star=>{
      let top = parseFloat(star.style.top);
      top += 0.5;
      if(top>window.innerHeight) top = 0;
      star.style.top = top+'px';
    });
    requestAnimationFrame(animateStars);
  }
  animateStars();
</script>

<!-- Wokwi Simulator Embed -->
<div class="wokwi-container">
  <iframe src="https://wokwi.com/projects/460318666113414145" width="100%" height="100%" frameborder="0"></iframe>
</div>

</body>
</html>
